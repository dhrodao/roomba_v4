[pytest]
testpaths = tests
addopts = -ra
# pytest-asyncio settings (auto mode + fixture loop scope) are applied in
# tests/conftest.py, but only when the plugin is installed (it ships with
# pytest-homeassistant-custom-component). Declaring them here would raise an
# "unknown config option" warning in the pure test tier, where pytest-asyncio
# is absent.
markers =
    hass: tests that require a full Home Assistant environment
        (pytest-homeassistant-custom-component). Run with: pytest -m hass
